<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Game</title>

<style>
body {
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    background: #020617;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

.game {
    width: 100vw;
    max-width: none;
    margin: 0;
    padding: 3vh 2vw;
    box-sizing: border-box;
}

h1 {
  font-size: 42px;
  margin-bottom: 20px;
  font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
  color: #7DF9FF;
  text-shadow: 3px 3px 0 #173b7a, 0 0 12px rgba(255, 209, 102, 0.45);
  letter-spacing: 1px;
}

#question {
    font-size: 32px;
    margin: 30px 0;
    font-family: "Trebuchet MS", Arial, sans-serif;
    font-weight: bold;
    color: #FFE066;
    text-shadow: 2px 2px 0 #173b7a;
    letter-spacing: 1px;
}

.answer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: linear-gradient(135deg, #173b7a, #2456a6);
  border: 3px solid #555;
  border-radius: 12px;
  margin: 12px 0;
  padding: 12px 25px;
  font-size: 28px;
  font-family: "Trebuchet MS", Arial, sans-serif;
  box-sizing: border-box;
}
  .answer:nth-child(1) {
  background: linear-gradient(135deg, #174ea6, #2878d8);
}

.answer:nth-child(2) {
  background: linear-gradient(135deg, #176b52, #24a87a);
}

.answer:nth-child(3) {
  background: linear-gradient(135deg, #7a3e9d, #a85dcc);
}

.answer:nth-child(4) {
  background: linear-gradient(135deg, #a84b24, #dc743d);
}

.answer:nth-child(5) {
  background: linear-gradient(135deg, #8b2f4f, #c94d70);
}

.number {
  width: 50px;
}

.text {
  flex: 1;
  text-align: left;
  margin-left: 20px;
  font-weight: bold;
}

.points {
  width: 100px;
  font-size: 32px;
  font-weight: bold;
  font-family: "Arial Black", "Trebuchet MS", sans-serif;
  transition: transform 0.3s ease, opacity 0.3s ease;
}

@keyframes pointsPop {
  0% {
    transform: scale(0.5);
    opacity: 0;
  }

  60% {
    transform: scale(1.3);
    opacity: 1;
  }

  100% {
    transform: scale(1);
    opacity: 1;
  }
}

.points.pop {
  animation: pointsPop 0.6s ease;
}.hidden {
  visibility: hidden;
}

button {
    font-size: 20px;
    padding: 12px 20px;
    margin: 8px;
    border: 2px solid #7DF9FF;
    border-radius: 12px;
    cursor: pointer;
    font-family: "Trebuchet MS", Arial, sans-serif;
    font-weight: bold;
    color: #06203A;
    background: #FFE066;
    box-shadow: 0 4px 10px rgba(0,0,0,0.35);
}

input {
  font-size: 22px;
  padding: 12px;
  width: 180px;
  text-align: center;
  border-radius: 8px;
  border: none;
}

#hostControls {
  margin-top: 25px;
}

#gameCode {
  font-size: 32px;
  margin: 20px;
  font-weight: bold;
}

#status {
    font-size: 24px;
    margin: 15px;
    font-family: "Trebuchet MS", Arial, sans-serif;
    font-weight: bold;
    color: #7DF9FF;
    text-shadow: 2px 2px 0 #173b7a;
    letter-spacing: 1px;
}

.screen {
  margin-top: 50px;
}
  #hostScreen h2 {
    font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
    color: #7DF9FF;
    font-size: 40px;
    text-shadow: 2px 2px 0 #173b7a;
    letter-spacing: 2px;
  }
}
</style>
</head>

<body>

<div class="game">

  <h1>🎉 FUNNY FAMILY GAME NIGHT 🎂</h1>

  <div id="menu" class="screen">
    <h2>Choose Screen</h2>

    <button onclick="startHost()">HOST</button>
    <button onclick="startAudience()">AUDIENCE</button>
  </div>

  <div id="hostScreen" class="screen" style="display:none;">

    <h2>HOST SCREEN</h2>

    <div id="gameCode"></div>
    <div id="status"></div>

    <div id="hostQuestion"></div>
    <div id="hostAnswers"></div>

    <div id="hostControls">
      <button onclick="previousQuestion()">⬅ Previous</button>
      <button onclick="nextQuestion()">Next ➡</button>
      <button onclick="revealNext()">Reveal Answer</button>
<button onclick="wrongAnswer()">❌ WRONG ANSWER</button>
    </div> </div>

  </div>

  <div id="audienceScreen" class="screen" style="display:none;">

    <div id="joinArea">
      <h2>Enter Game Code</h2>

      <input id="codeInput"
             maxlength="6"
             placeholder="CODE">

      <br>

      <button onclick="joinGame()">JOIN GAME</button>
    </div>

    <div id="audienceGame" style="display:none;">

  <button id="fullscreenButton" onclick="goFullscreen()">⛶ FULL SCREEN</button>

  <div id="question"></div>
  <div id="answers"></div>

  </div>

</div>


<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

const firebaseConfig = {

  apiKey: "AIzaSyD99604lgKq6eJb1xkqJPBECZMmju4x-4E",

  authDomain: "live-quiz-game-79f0e.firebaseapp.com",

  databaseURL:
    "https://live-quiz-game-79f0e-default-rtdb.firebaseio.com",

  projectId: "live-quiz-game-79f0e",

  storageBucket:
    "live-quiz-game-79f0e.firebasestorage.app",

  messagingSenderId: "489513542029",

  appId:
    "1:489513542029:web:c9a61c48a4412408071dc4"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();


/* QUESTIONS */

const questions = [

  {
    question: "What is your favorite dish?",
    answers: [
      ["Momo", 5],
      ["Dal bhat", 4],
      ["Chowmein", 3],
      ["Biryani", 2],
      ["Pizza", 1]
    ]
  },

  {
    question: "Name something Nyisher is really good at",
    answers: [
      ["Dancing", 5],
      ["Taking care of kids", 4],
      ["Singing", 3],
      ["Driving", 2],
      ["Bargaining", 1]
    ]
  }

];


let currentQuestion = 0;
let revealed = [];
let gameCode = "";
let isHost = false;


/* SCREEN SELECTION */

function startHost() {

  isHost = true;

  document.getElementById("menu").style.display = "none";
  document.getElementById("hostScreen").style.display = "block";

  createGame();
}


function startAudience() {

  document.getElementById("menu").style.display = "none";
  document.getElementById("audienceScreen").style.display = "block";
}


/* CREATE GAME */

function createGame() {

  gameCode =
    Math.floor(100000 + Math.random() * 900000).toString();

  revealed = [];

  const gameRef = db.ref("familyGames/" + gameCode);

  gameRef.set({

    currentQuestion: 0,

    revealed: [],

    active: true

  })
  .then(() => {

    document.getElementById("gameCode").textContent =
      "GAME CODE: " + gameCode;

    document.getElementById("status").textContent =
      "Waiting for audience...";

    showHostQuestion();

    listenForAudience();

  })
  .catch(error => {

    alert("Could not create game: " + error.message);

  });

}


/* HOST LISTENER */

function listenForAudience() {

  db.ref("familyGames/" + gameCode + "/active")
    .on("value", snapshot => {

      if (snapshot.val()) {

        document.getElementById("status").textContent =
          "Game is LIVE";

      }

    });

}


/* SHOW HOST QUESTION */

function showHostQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("hostQuestion").innerHTML =
    "<h2>" + q.question + "</h2>";

  const container =
    document.getElementById("hostAnswers");

  container.innerHTML = "";

  q.answers.forEach((answer, index) => {

    const row = document.createElement("div");

    row.className = "answer";

    row.innerHTML =

      '<div class="number">' +
      (index + 1) +
      '</div>' +

      '<div class="text">' +
      answer[0] +
      '</div>' +

      '<div class="points">' +
      answer[1] +
      ' pts' +
      '</div>';

    row.onclick = function() {

      revealAnswer(index);

    };

    container.appendChild(row);

  });

}


/* REVEAL ANSWER */

function revealAnswer(index) {

  if (!revealed.includes(index)) {

    revealed.push(index);

  }

  updateFirebase();

}


/* REVEAL ALL */

/* REVEAL NEXT */

function revealNext() {

  const answers = questions[currentQuestion].answers;

  const unrevealed = answers
    .map((answer, index) => index)
    .filter(index => !revealed.includes(index));

  if (unrevealed.length > 0) {

    const randomIndex =
      unrevealed[Math.floor(Math.random() * unrevealed.length)];

    revealed.push(randomIndex);

    updateFirebase();

  }

}

/* UPDATE FIREBASE */

function updateFirebase() {

  db.ref("familyGames/" + gameCode).update({

    currentQuestion: currentQuestion,

    revealed: revealed

  });

  updateHostDisplay();

}


/* HOST DISPLAY */

function updateHostDisplay() {

  const rows =
    document.querySelectorAll("#hostAnswers .answer");

  rows.forEach((row, index) => {

    if (revealed.includes(index)) {

      row.style.opacity = "1";

    } else {

      row.style.opacity = "0.45";

    }

  });

}


/* NEXT QUESTION */

function nextQuestion() {

  if (currentQuestion < questions.length - 1) {

    currentQuestion++;

    revealed = [];

    updateFirebase();

    showHostQuestion();

  }

}


/* PREVIOUS QUESTION */

function previousQuestion() {

  if (currentQuestion > 0) {

    currentQuestion--;

    revealed = [];

    updateFirebase();

    showHostQuestion();

  }

}


/* JOIN GAME */

function joinGame() {

  gameCode =
    document.getElementById("codeInput")
    .value.trim();

  if (gameCode.length !== 6) {

    alert("Please enter the 6-digit game code.");

    return;

  }

  const gameRef =
    db.ref("familyGames/" + gameCode);

  gameRef.once("value")
    .then(snapshot => {

      if (!snapshot.exists()) {

        alert("Game not found.");

        return;

      }

      document.getElementById("joinArea")
        .style.display = "none";

      document.getElementById("audienceGame")
        .style.display = "block";

      listenToGame();

    })
    .catch(error => {

      alert("Could not join game: " + error.message);

    });

}


/* AUDIENCE LISTENER */

function listenToGame() {

  db.ref("familyGames/" + gameCode)
    .on("value", snapshot => {

      const data = snapshot.val();

      if (!data) return;

      currentQuestion =
        data.currentQuestion || 0;

      revealed =
        data.revealed || [];
if (
  data.wrongAnswerSignal &&
  data.wrongAnswerSignal !== window.lastWrongAnswerSignal
) {
  window.lastWrongAnswerSignal = data.wrongAnswerSignal;
  showWrongAnswer();
  return;
}
      showAudienceQuestion();

    });

}


/* SHOW AUDIENCE */

function showAudienceQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("question").textContent =
    q.question;

  const container =
    document.getElementById("answers");

  container.innerHTML = "";

  q.answers.forEach((answer, index) => {
    const row = document.createElement("div");

    row.className = "answer";

    const isRevealed =
      revealed.includes(index);

    row.innerHTML =

      '<div class="number">' +
      (index + 1) +
      '</div>' +

      '<div class="text">' +

      (isRevealed
        ? answer[0]
        : "????????") +

      '</div>' +

      '<div class="points ' +
(isRevealed && index === revealed[revealed.length - 1] ? 'pop' : '') +
'">' +

      (isRevealed
        ? answer[1] + " pts"
        : "") +

      '</div>';

    container.appendChild(row);

  });

}

function wrongAnswer() {
  db.ref("familyGames/" + gameCode).update({
    wrongAnswerSignal: Date.now()
  });

  playWrongSound();
  }
  function playWrongSound() {
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "square";
  oscillator.frequency.value = 180;
  gain.gain.value = 0.15;

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + 0.25);
}
  function showWrongAnswer() {
    const cross = document.createElement("div");

    cross.textContent = "❌";

    cross.style.position = "fixed";
    cross.style.top = "50%";
    cross.style.left = "50%";
    cross.style.transform = "translate(-50%, -50%)";
    cross.style.fontSize = "180px";
    cross.style.zIndex = "9999";
    cross.style.textAlign = "center";

    document.body.appendChild(cross);

    setTimeout(() => {
        cross.remove();
    }, 1500);
  }
  function goFullscreen() {
  const element = document.documentElement;

  if (element.requestFullscreen) {
    element.requestFullscreen();
  } else if (element.webkitRequestFullscreen) {
    element.webkitRequestFullscreen();
  }
}

</script>

</body>
</html>
