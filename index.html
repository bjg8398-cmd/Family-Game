/* SCREEN SELECTION */

function startHost() {

  isHost = true;
    const music = document.getElementById("backgroundMusic");
music.volume = 0.20;
music.play();

  document.getElementById("menu").style.display = "none";
  document.getElementById("hostScreen").style.display = "block";

  createGame();
}


function startAudience() {

  document.getElementById("menu").style.display = "none";
  document.getElementById("audienceScreen").style.display = "block";
}


/* CREATE GAME */

function createGame() {

  gameCode =
    Math.floor(100000 + Math.random() * 900000).toString();

  revealed = [];

  const gameRef = db.ref("familyGames/" + gameCode);

  gameRef.set({

    currentQuestion: 0,

    revealed: [],

    active: true

  })
  .then(() => {

    document.getElementById("gameCode").textContent =
      "GAME CODE: " + gameCode;

    document.getElementById("status").textContent =
      "Waiting for audience...";

    showHostQuestion();

    listenForAudience();

  })
  .catch(error => {

    alert("Could not create game: " + error.message);

  });

}


/* HOST LISTENER */

function listenForAudience() {

  db.ref("familyGames/" + gameCode + "/active")
    .on("value", snapshot => {

      if (snapshot.val()) {

        document.getElementById("status").textContent =
          "Game is LIVE";

      }

    });

}


/* SHOW HOST QUESTION */

function showHostQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("hostQuestion").innerHTML =
    "<h2>" + q.question + "</h2>";

  const container =
    document.getElementById("hostAnswers");

  container.innerHTML = "";

  q.answers.forEach((answer, index) => {

    const row = document.createElement("div");

    row.className = "answer";

    row.innerHTML =

      '<div class="number">' +
      (index + 1) +
      '</div>' +

      '<div class="text">' +
      answer[0] +
      '</div>' +

      '<div class="points">' +
      answer[1] +
      ' pts' +
      '</div>';

    row.onclick = function() {

      revealAnswer(index);

    };

    container.appendChild(row);

  });

}

let gameAudio;

function getGameAudio() {
    if (!gameAudio) {
        gameAudio = new (window.AudioContext || window.webkitAudioContext)();
    }

    if (gameAudio.state === "suspended") {
        gameAudio.resume();
    }

    return gameAudio;
}
    function playCorrectSound() {
  const audio = getGameAudio();

  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  oscillator.type = "sine";
  oscillator.frequency.setValueAtTime(660, audio.currentTime);
  oscillator.frequency.setValueAtTime(880, audio.currentTime + 0.12);

  gain.gain.setValueAtTime(0.5, audio.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audio.currentTime + 0.8);

  oscillator.connect(gain);
  gain.connect(audio.destination);

  oscillator.start();
  oscillator.stop(audio.currentTime + 0.8);
}
/* REVEAL ANSWER */

function revealAnswer(index) {

  if (!revealed.includes(index)) {

    revealed.push(index);
    playCorrectSound();

  }

  updateFirebase();

}


/* REVEAL ALL */

/* REVEAL NEXT */

function revealNext() {

  const answers = questions[currentQuestion].answers;

  const unrevealed = answers
    .map((answer, index) => index)
    .filter(index => !revealed.includes(index));

  if (unrevealed.length > 0) {

    const randomIndex =
      unrevealed[Math.floor(Math.random() * unrevealed.length)];

    revealed.push(randomIndex);
playCorrectSound();
    updateFirebase();

  }

}

/* UPDATE FIREBASE */

function updateFirebase() {

  db.ref("familyGames/" + gameCode).update({

    currentQuestion: currentQuestion,

    revealed: revealed

  });

  updateHostDisplay();

}


/* HOST DISPLAY */

function updateHostDisplay() {

  const rows =
    document.querySelectorAll("#hostAnswers .answer");

  rows.forEach((row, index) => {

    if (revealed.includes(index)) {

      row.style.opacity = "1";

    } else {

      row.style.opacity = "0.45";

    }

  });

}


/* NEXT QUESTION */

function nextQuestion() {

  if (currentQuestion < questions.length - 1) {

    currentQuestion++;

    revealed = [];

    updateFirebase();

    showHostQuestion();

  }

}


/* PREVIOUS QUESTION */

function previousQuestion() {

  if (currentQuestion > 0) {

    currentQuestion--;

    revealed = [];

    updateFirebase();

    showHostQuestion();

  }

}


/* JOIN GAME */

function joinGame() {

  gameCode =
    document.getElementById("codeInput")
    .value.trim();

  if (gameCode.length !== 6) {

    alert("Please enter the 6-digit game code.");

    return;

  }

  const gameRef =
    db.ref("familyGames/" + gameCode);

  gameRef.once("value")
    .then(snapshot => {

      if (!snapshot.exists()) {

        alert("Game not found.");

        return;

      }

      document.getElementById("joinArea")
        .style.display = "none";

      document.getElementById("audienceGame")
        .style.display = "block";

      listenToGame();

    })
    .catch(error => {

      alert("Could not join game: " + error.message);

    });

}


/* AUDIENCE LISTENER */

function listenToGame() {

  db.ref("familyGames/" + gameCode)
    .on("value", snapshot => {

      const data = snapshot.val();

      if (!data) return;

      currentQuestion =
        data.currentQuestion || 0;

      revealed =
        data.revealed || [];
if (
  data.wrongAnswerSignal &&
  data.wrongAnswerSignal !== window.lastWrongAnswerSignal
) {
  window.lastWrongAnswerSignal = data.wrongAnswerSignal;
  showWrongAnswer();
  return;
}
      showAudienceQuestion();

    });

}


/* SHOW AUDIENCE */

function showAudienceQuestion() {

  const q = questions[currentQuestion];

  document.getElementById("question").textContent =
    q.question;

  const container =
    document.getElementById("answers");

  container.innerHTML = "";

  q.answers.forEach((answer, index) => {
    const row = document.createElement("div");

    row.className = "answer";

    const isRevealed =
      revealed.includes(index);

    row.innerHTML =

      '<div class="number">' +
      (index + 1) +
      '</div>' +

      '<div class="text">' +

      (isRevealed
        ? answer[0]
        : "????????") +

      '</div>' +

      '<div class="points ' +
(isRevealed && index === revealed[revealed.length - 1] ? 'pop' : '') +
'">' +

      (isRevealed
        ? answer[1] + " pts"
        : "") +

      '</div>';

    container.appendChild(row);

  });

}

function wrongAnswer() {
  db.ref("familyGames/" + gameCode).update({
    wrongAnswerSignal: Date.now()
  });

  playWrongSound();
  }
  function playWrongSound() {
  const audioContext = getGameAudio();
  const oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.type = "square";
  oscillator.frequency.value = 180;
  gain.gain.value = 0.15;

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.start();
  oscillator.stop(audioContext.currentTime + 0.25);
}
  function showWrongAnswer() {
    const cross = document.createElement("div");

    cross.textContent = "❌";

    cross.style.position = "fixed";
    cross.style.top = "50%";
    cross.style.left = "50%";
    cross.style.transform = "translate(-50%, -50%)";
    cross.style.fontSize = "180px";
    cross.style.zIndex = "9999";
    cross.style.textAlign = "center";

    document.body.appendChild(cross);

    setTimeout(() => {
        cross.remove();
    }, 1500);
  }
  function goFullscreen() {
  const element = document.documentElement;

  if (element.requestFullscreen) {
    element.requestFullscreen();
  } else if (element.webkitRequestFullscreen) {
    element.webkitRequestFullscreen();
  }
}

function toggleMusic() {
    const music = document.getElementById("backgroundMusic");
    const button = document.querySelector('#hostControls button[onclick="toggleMusic()"]');

    if (music.paused) {
        music.play();
        button.textContent = "🎵 MUSIC ON";
    } else {
        music.pause();
        button.textContent = "🔇 MUSIC OFF";
    }
}

</script>
<audio id="backgroundMusic" src="family_quiz_background_music_upbeat.wav" loop preload="auto"></audio>
</body>
